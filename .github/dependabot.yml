# Dependency updates, monthly, one grouped pull request.
#
# Updates move Cargo.lock only (lockfile-only): CI then builds against current dependencies without
# raising the versions in Cargo.toml, which is a deliberate change rather than routine churn.
#
# Ignored, because each moves deliberately:
# - yubikey: a git dependency pinned to the fork commit carrying the PQC support, until a release
#   has it.
# - pkcs12_builder, cms, pkcs12: git dependencies pinned to commits that resolve together; later
#   formats commits need an unpublished x509-cert.
# - rustls: pinned with `=`.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      - dependency-name: "yubikey"
      - dependency-name: "pkcs12_builder"
      - dependency-name: "cms"
      - dependency-name: "pkcs12"
      - dependency-name: "rustls"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
